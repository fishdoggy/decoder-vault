<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>解碼局 任務庫</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#10151E; --shell:#1A2231; --shell2:#232D3F; --line:#31405A;
  --amber:#F6A93B; --amber-dim:#9C6C24; --amber-wash:rgba(246,169,59,.13);
  --text:#C6D2E4; --dim:#7C8BA5;
  --paper:#FAFAF8; --paper-ink:#1B1F26; --paper-dim:#6B7280; --paper-line:#E3E3DF;
  --good:#5BC98C; --bad:#FF7452;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
/* 必須擺在所有元件樣式之前：.decoded 這類設了 display 的 class 會壓過瀏覽器
   對 hidden 屬性的預設 display:none，解碼器翻譯就會一開始就洩漏出來 */
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font-family:var(--sans);margin:0;
  padding-block:14px;padding-left:16px;padding-right:16px;min-height:100vh;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:20px;
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.brand{display:flex;align-items:center;gap:7px;color:var(--amber);cursor:pointer;background:none;
  border:none;padding:0;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);
  animation:pulse 2.6s ease-in-out infinite;flex-shrink:0}
@keyframes pulse{50%{opacity:.35}}
.cells{display:flex;gap:4px;align-items:center}
.cell{width:11px;height:5px;border-radius:1px;background:var(--amber)}
.cell.off{background:var(--line)}

/* ── 賽程選單 ── */
.menu-head{padding:6px 2px 2px;display:flex;flex-direction:column;gap:7px}
.menu-head h1{font-size:21px;margin:0;color:#fff;letter-spacing:.01em;font-weight:700}
.menu-head p{margin:0;font-size:13.5px;line-height:1.75;color:var(--dim);max-width:46ch}
.bands{display:flex;flex-direction:column;gap:10px}
.band{background:var(--shell);border:1px solid var(--line);border-radius:12px;padding:15px 16px;
  display:flex;flex-direction:column;gap:9px;cursor:pointer;text-align:left;width:100%;
  font-family:var(--sans);color:var(--text);transition:border-color .15s,background .15s}
.band:hover{border-color:var(--amber-dim);background:var(--shell2)}
.band:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.band-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.band-name{font-size:16.5px;font-weight:700;color:#fff}
.bars{display:flex;gap:3px;align-items:center;flex-shrink:0}
.bar{width:4px;border-radius:1px;background:var(--line)}
.bar.on{background:var(--amber)}
.bar:nth-child(1){height:7px} .bar:nth-child(2){height:11px} .bar:nth-child(3){height:15px}
.band-desc{font-size:13px;line-height:1.7;color:var(--dim);margin:0}
.band-foot{display:flex;gap:14px;align-items:center;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;color:var(--dim);border-top:1px solid var(--line);padding-top:9px}
.band-foot .done{color:var(--good)}

/* ── 驗收方式切換 ── */
.modebar{display:flex;align-items:center;gap:7px;padding:11px 13px;background:var(--shell);
  border:1px solid var(--line);border-radius:11px;flex-wrap:wrap}
.modebar .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim);
  text-transform:uppercase;margin-right:auto}
.modebar button{padding:8px 12px;font-size:12px;font-weight:600;border-radius:8px;flex:0 0 auto}
.modebar button.on{background:var(--amber-wash);border-color:var(--amber);color:var(--amber)}
.modehint{font-size:11.5px;line-height:1.65;color:var(--dim);margin:0;flex-basis:100%}

/* ── 任務簡報 ── */
.brief{background:var(--shell);border:1px solid var(--line);border-radius:12px;padding:15px 16px;
  display:flex;flex-direction:column;gap:11px}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--amber-dim);text-transform:uppercase}
.client{font-size:14.5px;line-height:1.65;margin:0}
.client .who{color:var(--dim)}
.q{font-size:17px;font-weight:700;line-height:1.5;margin:0;color:#fff;text-wrap:balance;
  border-left:3px solid var(--amber);padding-left:11px}

/* ── 截獲文件 ── */
.doc{background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:18px 17px;
  position:relative;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.doc::before{content:"INTERCEPTED";position:absolute;top:-8px;right:12px;font-family:var(--mono);
  font-size:9px;letter-spacing:.2em;background:var(--amber);color:#2A1B05;padding:2px 7px;
  border-radius:3px;font-weight:600}
.z{cursor:pointer;border-radius:4px;padding:3px 4px;margin:0 -4px;border-bottom:1.5px dotted #B9B9B2;
  transition:background .12s,box-shadow .12s;-webkit-tap-highlight-color:transparent}
.z:hover{background:#EDEDE6}
.z.sel{background:var(--amber-wash);box-shadow:0 0 0 2px var(--amber);border-bottom-color:transparent}
.z.right{background:rgba(91,201,140,.2);box-shadow:0 0 0 2px var(--good);border-bottom-color:transparent}
.z.wrong{background:rgba(255,116,82,.16);box-shadow:0 0 0 2px var(--bad);border-bottom-color:transparent}
.doc.locked .z{cursor:default;pointer-events:none}
.z{background:rgba(246,169,59,.08)}
.hit{cursor:pointer;border-radius:5px;transition:background .12s;-webkit-tap-highlight-color:transparent}
.hit:hover{background:#F0EFE8}
.hit:active{background:#E8E7DE}
.doc.locked .hit{cursor:default;pointer-events:none}
.howto{margin:0;font-size:12.5px;color:var(--amber);line-height:1.6}
.howto strong{color:#fff}

.d-kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-dim);
  font-family:var(--mono);margin-bottom:6px}
.d-title{font-size:20px;font-weight:800;line-height:1.25;margin:0 0 10px;font-family:var(--sans)}
.d-row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-top:1px solid var(--paper-line);
  font-size:13.5px;align-items:baseline}
.d-row .k{color:var(--paper-dim);flex-shrink:0}
.d-row .v{text-align:right;font-weight:600}
.d-fine{font-size:11.5px;color:var(--paper-dim);line-height:1.75;margin-top:11px}
.d-list{margin:0;padding-left:16px;font-size:13.5px;line-height:2}
.d-sec{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--paper-dim);
  margin:13px 0 4px;text-transform:uppercase}
.d-price{font-size:26px;font-weight:800;letter-spacing:-.02em}
.d-strike{text-decoration:line-through;color:var(--paper-dim);font-weight:500;font-size:15px}
.d-badge{display:inline-block;background:#1B1F26;color:#fff;font-size:12px;font-weight:700;
  padding:3px 9px;border-radius:4px;font-family:var(--mono)}
.d-warn{background:#FFF4E0;border-left:3px solid #E0A020;padding:9px 11px;font-size:12.5px;
  line-height:1.65;margin-top:11px;border-radius:0 5px 5px 0}
.d-meta{font-size:12.5px;color:var(--paper-dim);margin-top:3px}
.d-para{font-size:13.5px;line-height:2.2;margin:0}
.lego{background:#D01012;color:#fff;font-weight:800;font-size:13px;letter-spacing:.06em;
  padding:4px 9px;border-radius:5px;display:inline-block}
.d-key{display:flex;justify-content:space-between;gap:14px;padding:8px 0;font-size:14px;
  border-bottom:1px solid var(--paper-line);align-items:center}
.d-key .cap{font-family:var(--mono);font-size:12px;background:#1B1F26;color:#fff;padding:3px 9px;
  border-radius:4px;font-weight:600}
.d-fore{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--paper-line);font-size:14.5px}
.d-fore .day{color:var(--paper-dim);width:32%}
.d-fore .tmp{font-weight:700;font-variant-numeric:tabular-nums}
.d-post{border-left:2px solid var(--paper-line);padding:6px 0 6px 11px;margin:9px 0;font-size:13px;
  line-height:1.75}
.d-post .au{font-family:var(--mono);font-size:10.5px;color:var(--paper-dim);display:block;margin-bottom:3px;
  letter-spacing:.06em}
.d-vote{font-family:var(--mono);font-size:10.5px;color:var(--paper-dim)}

/* ── 控制列 ── */
.ctrl{display:flex;gap:9px}
button{font-family:var(--sans);font-size:14px;font-weight:700;border-radius:10px;padding:13px 14px;
  border:1px solid var(--line);background:var(--shell2);color:var(--text);cursor:pointer;
  transition:transform .1s,background .15s,opacity .15s;-webkit-tap-highlight-color:transparent}
button:active{transform:translateY(1px)}
button:disabled{opacity:.34;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.send{flex:1;background:var(--amber);border-color:var(--amber);color:#2A1B05}
.send:disabled{background:var(--shell2);border-color:var(--line);color:var(--dim)}
.decode{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;flex-shrink:0}
.ghost{background:none;border-color:var(--line);color:var(--dim);font-weight:500;font-size:13px}

/* ── 判定 ── */
.verdict{border-radius:12px;padding:15px 16px;display:flex;flex-direction:column;gap:9px;
  border:1px solid var(--line);background:var(--shell)}
.verdict.ok{border-color:rgba(91,201,140,.45);background:linear-gradient(var(--shell),rgba(91,201,140,.07))}
.verdict.no{border-color:rgba(255,116,82,.4)}
.v-head{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  display:flex;gap:8px;align-items:center}
.verdict.ok .v-head{color:var(--good)}
.verdict.no .v-head{color:var(--bad)}
.v-body{font-size:14.5px;line-height:1.7;margin:0}
.v-body b{color:#fff}
.gain{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.1em}

.decoded{background:#0B0F16;border:1px solid var(--amber-dim);border-radius:10px;padding:12px 14px;
  display:flex;flex-direction:column;gap:7px}
.decoded .tag{color:var(--amber)}
.drow{display:flex;justify-content:space-between;gap:14px;font-size:13.5px;align-items:baseline}
.drow .en{font-family:var(--mono);color:var(--amber);font-size:13px}
.drow .zh{text-align:right}

/* ── 口頭回報 ── */
.voice{background:#0B0F16;border:1px solid var(--amber-dim);border-radius:12px;padding:14px 15px;
  display:flex;flex-direction:column;gap:12px;margin-top:10px}
.voice .tag{color:var(--amber)}
.voice-note{margin:0;font-size:12.5px;line-height:1.7;color:var(--dim)}
.voice-note strong{color:var(--amber)}
.vrow{display:flex;flex-direction:column;gap:9px;padding-top:12px;border-top:1px solid var(--line)}
.vtxt{font-family:var(--mono);font-size:15px;line-height:1.6;color:#fff}
.vtxt .n{color:var(--amber-dim);font-size:11px;letter-spacing:.14em;display:block;margin-bottom:4px}
.vbtns{display:flex;gap:7px;flex-wrap:wrap}
.vbtns button{padding:10px 13px;font-size:12.5px;font-weight:600;flex:0 0 auto}
.vlisten{border-color:var(--amber-dim);color:var(--amber)}
.vdone{flex:1 1 auto;min-width:164px}
.vdone.ok{background:rgba(91,201,140,.15);border-color:var(--good);color:var(--good)}
.vrow.speaking .vtxt{color:var(--amber)}
.vmic{flex:1 1 auto;min-width:130px;border-color:var(--amber-dim);color:var(--amber)}
.vrow.hearing .vmic{background:rgba(255,116,82,.14);border-color:var(--bad);color:var(--bad)}
.vres{display:flex;flex-direction:column;gap:6px;background:var(--shell);border-radius:9px;
  padding:11px 12px;border:1px solid var(--line)}
.vres.pass{border-color:rgba(91,201,140,.5)}
.vres.fail{border-color:rgba(255,116,82,.42)}
.vscore{display:flex;align-items:baseline;gap:9px;font-family:var(--mono)}
.vscore .num{font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.vres.pass .num{color:var(--good)} .vres.fail .num{color:var(--bad)}
.vscore .lab{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.vheard{font-size:12.5px;line-height:1.7;color:var(--dim)}
.vheard i{font-style:normal;font-family:var(--mono);color:var(--text)}
.vheard b{color:var(--bad);font-weight:600}
.vadult{font-size:12px;font-weight:500;color:var(--dim);border-style:dashed}
.meter{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:var(--bad);transition:width .4s ease}
.vres.pass .meter span{background:var(--good)}
.tally{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--dim)}
.final{background:var(--shell);border:1px solid var(--amber-dim);border-radius:14px;padding:26px 20px;
  text-align:center;display:flex;flex-direction:column;gap:14px}
.final h2{font-size:23px;margin:0;color:#fff}
.score{font-family:var(--mono);font-size:46px;color:var(--amber);line-height:1;font-weight:600;
  font-variant-numeric:tabular-nums}
.final p{font-size:14px;line-height:1.75;color:var(--dim);margin:0}
.wins{border-top:1px solid var(--line);padding-top:15px;width:100%;text-align:left}
.wins .wrow{font-size:14.5px;line-height:1.7;padding:6px 0 6px 15px;position:relative;color:var(--text)}
.wins .wrow::before{content:"";position:absolute;left:0;top:14px;width:6px;height:6px;border-radius:50%;
  background:var(--good)}
.next{border-top:1px solid var(--line);padding-top:15px;font-size:13.5px;line-height:1.8;
  text-align:left;color:var(--text)}
.next .tag{display:block;margin-bottom:7px}
.foot{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#4A5875;text-align:center;
  text-transform:uppercase;padding-top:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* 診斷用：iPad/iOS 上看不到 console，所以把錯誤直接畫在頁面上 */
(function(){
  function show(title,detail){
    try{
      var d=document.createElement("pre");
      d.setAttribute("data-err","1");
      d.style.cssText="background:#3A1414;color:#FFB4A2;padding:12px 13px;font:11px/1.6 ui-monospace,Menlo,monospace;"+
        "white-space:pre-wrap;word-break:break-word;border:1px solid #7A2A2A;border-radius:9px;margin:12px 0";
      d.textContent="⚠ "+title+"（請截圖給我）\n\n"+detail;
      (document.body||document.documentElement).insertBefore(d,(document.body||document.documentElement).firstChild);
    }catch(e){}
  }
  window.addEventListener("error",function(e){
    show("程式錯誤", (e.message||"?")+"\n位置 行"+(e.lineno||"?")+" 欄"+(e.colno||"?")+
      (e.error&&e.error.stack?"\n\n"+String(e.error.stack).split("\n").slice(0,4).join("\n"):""));
  });
  window.addEventListener("unhandledrejection",function(e){
    show("未處理的錯誤", String((e.reason&&(e.reason.stack||e.reason.message))||e.reason||"?").slice(0,400));
  });
  window.__diag=show;
})();
</script>

<div class="wrap">
  <div class="top">
    <button class="brand" id="home"><span class="dot"></span>解碼局</button>
    <span id="prog"></span>
    <span class="cells" id="cells"></span>
  </div>
  <div id="stage"></div>
  <div class="foot" id="foot">任務庫 · 三個賽程</div>
</div>

<script>
/* ══ 賽程一：熱身（10 關，字很少） ══ */
const WARMUP = [
  {
    code:"WIFI-GUEST", say:["password","Type in the password."],
    client:'<span class="who">委託人：</span>店裡有免費 Wi-Fi，桌上放了這張卡。我手機連不上。',
    q:"要連上網路，密碼那一格要打什麼？",
    ans:"pw",
    hint:"Network 是「網路名稱」，Password 才是「密碼」。你要的是 Password 那一行。",
    payoff:"連上了。<b>Password</b> 那行才是密碼，coffee2026。網路名稱是另一回事。",
    win:"連上網路了",
    miss:"情報有誤。我把網路名稱當密碼打了五次，手機還跳出「密碼錯誤」。",
    decode:[["Network","網路名稱"],["Password","密碼"],["Speed","速度"]],
    doc:`<div class="d-kicker">Table card</div>
      <h3 class="d-title" style="font-size:18px">Guest Wi-Fi</h3>
      <div class="d-row"><span class="k">Network</span><span class="v"><span class="z" data-z="net">MakerCafe_5G</span></span></div>
      <div class="d-row"><span class="k">Password</span><span class="v"><span class="z" data-z="pw">coffee2026</span></span></div>
      <div class="d-row"><span class="k">Speed</span><span class="v"><span class="z" data-z="spd">up to 300 Mbps</span></span></div>`
  },
  {
    code:"CTRL-SETUP", say:["jump","Press space to jump."],
    client:'<span class="who">委託人：</span>這款遊戲我剛下載，介面全是英文。',
    q:"要跳起來，該按哪一個鍵？",
    ans:"jump",
    hint:"Jump 就是「跳」。找到 Jump 那一行，看它右邊寫什麼鍵。",
    payoff:"知道了。<b>Jump = Space</b>，空白鍵。我過第一關了。",
    win:"過了第一關",
    miss:"情報有誤。我一直按錯鍵，卡在第一個坑裡跳不過去。",
    decode:[["Jump","跳躍"],["Sprint","衝刺"],["Move","移動"]],
    doc:`<div class="d-kicker">Settings</div>
      <h3 class="d-title" style="font-size:17px">Controls</h3>
      <div class="d-key"><span class="z" data-z="move">Move</span><span class="cap">W A S D</span></div>
      <div class="d-key"><span class="z" data-z="jump">Jump</span><span class="cap">Space</span></div>
      <div class="d-key"><span class="z" data-z="sprint">Sprint</span><span class="cap">Shift</span></div>
      <div class="d-key" style="border-bottom:none"><span class="z" data-z="map">Map</span><span class="cap">M</span></div>`
  },
  {
    code:"NUTRITION-30G", say:["serving size","One serving is half a bag."],
    client:'<span class="who">委託人：</span>你說這包只有 150 大卡，所以可以整包吃掉。我看一下包裝。',
    q:"包裝上寫的 150 大卡，是整包還是半包？",
    ans:"serv",
    hint:"Serving 是「一份」。Serving size 那行寫的就是「一份等於多少」——它寫 1/2 bag。",
    payoff:"抓到了。<b>Serving size 1/2 bag</b>＝一份是半包。整包吃完是 300 大卡，不是 150。我們分兩天吃。",
    win:"沒把整包 300 大卡當 150 吃掉",
    miss:"情報有誤。你整包吃光，以為只有 150，其實吃了兩份的量。",
    decode:[["Serving size","一份的量"],["per serving","每一份"],["Servings per bag","一包有幾份"]],
    doc:`<div class="d-kicker">Nutrition label</div>
      <h3 class="d-title" style="font-size:17px">Nutrition Facts</h3>
      <div class="d-row"><span class="k">Serving size</span><span class="v"><span class="z" data-z="serv">1/2 bag (30 g)</span></span></div>
      <div class="d-row"><span class="k">Servings per bag</span><span class="v"><span class="z" data-z="count">2</span></span></div>
      <div class="d-row"><span class="k">Calories</span><span class="v"><span class="z" data-z="cal">150 per serving</span></span></div>
      <div class="d-row"><span class="k">Total sugars</span><span class="v"><span class="z" data-z="sugar">12 g</span></span></div>`
  },
  {
    code:"WX-TPE", say:["tomorrow","It will rain tomorrow."],
    client:'<span class="who">委託人：</span>明天要去動物園。我在想要不要帶傘。',

let CAN_SPEAK=false;

let VOICE=null;
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices()||[];
    VOICE = vs.find(v=>/^en[-_]US$/i.test(v.lang)&&/samantha|aria|jenny|zira|female/i.test(v.name))
         || vs.find(v=>/^en[-_]US$/i.test(v.lang))
         || vs.find(v=>/^en[-_]GB$/i.test(v.lang))
         || vs.find(v=>/^en/i.test(v.lang)) || null;
  }catch(e){}
}
if(CAN_SPEAK){ try{ pickVoice();
  if(speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged",pickVoice);
  else speechSynthesis.onvoiceschanged=pickVoice;
}catch(e){} }
function speak(text,slow,onend){
  if(!CAN_SPEAK){ onend&&onend(); return; }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-US"; if(VOICE) u.voice=VOICE;
    u.rate = slow?0.6:0.9; u.pitch=1; u.volume=1;
    u.onend=()=>onend&&onend(); u.onerror=()=>onend&&onend();
    speechSynthesis.speak(u);
  }catch(e){ onend&&onend(); }
}
/* 每關要唸的兩句：關鍵詞 + 整句。未手寫 say 的關卡由文件自動推導 */
function sayables(k){

/* ── 發音辨識與評分（門檻 88 分） ── */
const PASS_MARK = 88;
let SR=null;
try{ SR = window.SpeechRecognition||window.webkitSpeechRecognition||null; }catch(e){}
const CAN_HEAR = !!SR;
let micBlocked = false;   // 一旦確認拿不到麥克風，整場改走榮譽制

const NUMW={zero:"0",one:"1",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",eight:"8",
  nine:"9",ten:"10",eleven:"11",twelve:"12",thirty:"30"};
function norm(x){
  return String(x||"").toLowerCase().replace(/[\u2018\u2019]/g,"'")
    .replace(/[^a-z0-9'\s]/g," ").replace(/\s+/g," ").trim();
}
const tok=(x)=>norm(x).split(" ").filter(Boolean).map(w=>NUMW[w]||w);
function lev(a,b){
  if(a===b) return 0;
  if(!a.length||!b.length) return Math.max(a.length,b.length);
  let prev=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){
    const cur=[i];
    for(let j=1;j<=b.length;j++)
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[b.length];
}
const sim=(a,b)=>!a.length&&!b.length?1:1-lev(a,b)/Math.max(a.length,b.length);

/* 詞比對：字尾差異算詞形變化（寬容），字中換音算唸錯（嚴格）
   —— 否則 shipping / shopping 這種只差一個字母、卻是不同字的錯會被放過 */
function wordSim(a,b){
  if(a===b) return 1;
  const short=Math.min(a.length,b.length);
  let pre=0; while(pre<short&&a[pre]===b[pre]) pre++;
  if(pre===short && Math.abs(a.length-b.length)<=3) return 0.93;
  return sim(a,b) * (pre>=3 ? 0.95 : 0.8);
}

/* 分數＝詞命中率(72%) + 整體相似度(28%)；同時回報漏掉哪些詞 */
function pronScore(target,heard){
  const T=tok(target), H=tok(heard);
  if(!T.length) return {score:0,missed:[]};
  const used=new Set(); let hit=0; const missed=[];
  T.forEach(w=>{
    let bi=-1,bs=0;
    H.forEach((h,i)=>{ if(used.has(i))return; const v=wordSim(w,h); if(v>bs){bs=v;bi=i;} });
    if(bs>=0.74){ hit+=bs; used.add(bi); } else if(w.length>2) missed.push(w);
  });
  const recall=hit/T.length;
  const flat=sim(T.join(""),H.join(""));
  return {score:Math.round(100*(0.72*recall+0.28*flat)), missed};
}

function listen(target,cb){
  let r;
  try{ r=new SR(); }catch(e){ cb({error:"unsupported"}); return null; }
  r.lang="en-US"; r.interimResults=false; r.continuous=false; r.maxAlternatives=5;
  let settled=false;
  const finish=(o)=>{ if(settled)return; settled=true; cb(o); };
  r.onresult=(e)=>{
    const alts=[...e.results[0]].map(a=>a.transcript).filter(Boolean);
    if(!alts.length){ finish({error:"no-speech"}); return; }
    // 辨識引擎本身有誤差，取對他最有利的那個候選
    let best={score:-1};
    alts.forEach(txt=>{ const r2=pronScore(target,txt); if(r2.score>best.score) best={...r2,heard:txt}; });
    finish(best);
  };
  r.onerror=(e)=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed") micBlocked=true;
    finish({error:e.error||"error"});
  };
  r.onend=()=>finish({error:"no-speech"});
  try{ r.start(); }catch(e){ finish({error:"busy"}); }
  return r;
}

      <div class="tag">口頭回報 · 2 項</div>
      <p class="voice-note">${useMic
        ? `先按「聽」，再按<strong>唸給我聽</strong>，對著手機把它唸出來。唸不順就按「慢慢唸」多聽幾次。`
        : CAN_HEAR
          ? `這一關由媽媽驗收：先按「聽」，<strong>唸給媽媽聽</strong>，她聽過了才按下面那顆。`
          : `這台裝置沒辦法用麥克風判定，所以這一關由媽媽驗收：先按「聽」，<strong>唸給媽媽聽</strong>，她聽過了才按下面那顆。`}</p>
    </div>`);
  slot.appendChild(panel);

  pair.forEach((txt,idx)=>{
    const row=el(`<div class="vrow">
        <div class="vtxt"><span class="n">第 ${idx+1} 句 ${idx?"· 整句":"· 關鍵詞"}</span>${txt}</div>
        <div class="vbtns">
          ${CAN_SPEAK?`<button class="vlisten">▶ 聽</button><button class="vslow">慢慢唸</button>`:""}
          ${useMic?`<button class="vmic" disabled>🎙 唸給我聽</button>`
                  :`<button class="vdone" ${CAN_SPEAK?"disabled":""}>媽媽聽我唸過了</button>`}
        </div>
        <div class="vslot"></div>
      </div>`);
    panel.appendChild(row);
    const vslot=row.querySelector(".vslot");
    const btns=()=>[...row.querySelectorAll("button")];
    const unlock=()=>{ const m=row.querySelector(".vmic")||row.querySelector(".vdone"); if(m&&!done[idx]) m.disabled=false; };
    let tries=0;

    if(CAN_SPEAK){
      const play=(slow)=>{
        btns().forEach(b=>b.disabled=true); row.classList.add("speaking");
        let settled=false;
        // timedOut 為真＝語音引擎沒回報播完（macOS/Chrome 常見），此時才提示他不用等
        const restore=(timedOut)=>{
          if(settled) return; settled=true;
          row.classList.remove("speaking");
          btns().forEach(b=>b.disabled=false);
          unlock();
          if(done[idx]){ const m=row.querySelector(".vmic")||row.querySelector(".vdone"); if(m) m.disabled=true; }
          if(timedOut && !row.querySelector(".vfallback")){
            const n=document.createElement("div");
            n.className="vfallback vheard"; n.style.marginTop="2px";
            n.textContent="聽不到示範？照你會的唸法唸出聲就好，不用等它。";
            row.appendChild(n);
          }
        };
        const cap=setTimeout(()=>restore(true), Math.max(4500, txt.length*170));
        speak(txt,slow,()=>{ clearTimeout(cap); restore(false); });
      };
      row.querySelector(".vlisten").addEventListener("click",()=>play(false));
      row.querySelector(".vslow").addEventListener("click",()=>play(true));
    }

    const pass=(score)=>{
      done[idx]=true;
      S.spoken=(S.spoken||0)+1; save();
      const m=row.querySelector(".vmic")||row.querySelector(".vdone");
      if(m){ m.disabled=true; m.classList.add("ok"); m.textContent="✓ 已回報"; }
      if(done.every(Boolean)) nextBtn(t,slot);
    };

    if(useMic){
      const mic=row.querySelector(".vmic");
      mic.addEventListener("click",()=>{
        if(done[idx]) return;
        tries++;
        btns().forEach(b=>b.disabled=true);
        row.classList.add("hearing"); mic.textContent="● 正在聽…";
        vslot.innerHTML="";
        listen(txt,(r)=>{
          row.classList.remove("hearing");
          mic.textContent="🎙 再唸一次"; btns().forEach(b=>b.disabled=false);
          if(r.error){
            vslot.innerHTML="";
            vslot.appendChild(el(`<div class="vres fail"><div class="vheard">${ERRS[r.error]||"辨識失敗，再試一次。"}</div></div>`));
            if(micBlocked||r.error==="unsupported"||r.error==="service-not-allowed"){
              S.micMode=false; save();   // 這台拿不到麥克風，自動退回媽媽驗收
              const b=el(`<button class="vadult" style="width:100%;margin-top:8px">改成唸給媽媽聽 · 她聽過了就按這裡</button>`);
              vslot.appendChild(b); b.addEventListener("click",()=>pass(0));
            }
            return;
          }
          const ok=r.score>=PASS_MARK;
          vslot.innerHTML="";
          vslot.appendChild(el(`<div class="vres ${ok?"pass":"fail"}">
              <div class="vscore"><span class="lab">${ok?"聽清楚了":"再唸一次"}</span></div>
              <div class="meter"><span style="width:${Math.min(100,r.score)}%"></span></div>
              <div class="vheard">聽到的是：<i>${r.heard||"（聽不清楚）"}</i>${
                r.missed&&r.missed.length?`<br>沒唸清楚：<b>${r.missed.join(" · ")}</b>`:""}</div>
            </div>`));
          if(ok){ mic.textContent="✓ 已回報"; pass(r.score); return; }
          if(tries>=3){
            const b=el(`<button class="vadult" style="width:100%;margin-top:8px">試了三次 · 媽媽聽過了就按這裡放行</button>`);
            vslot.querySelector(".vres").after(b);
            b.addEventListener("click",()=>pass(r.score));
          }
        });
      });
    } else {
      const bd=row.querySelector(".vdone");
      bd.addEventListener("click",()=>{ if(!done[idx]) pass(0); });
    }
  });
}

function nextBtn(t,slot){
  const last = S.i===t.tasks.length-1;
  const b=el(`<button class="send" style="width:100%;margin-top:10px">${last?"結束賽程":"下一個任務"}</button>`);
  slot.appendChild(b);
  b.addEventListener("click",()=>{
    S.i++; S.tries=0; S.revealed=false; S.sel=null; save(); render(); window.scrollTo(0,0);
  });
}

function judge(t,k,doc,zones,slot,ctrl){
  S.tries++;
  const lock=()=>{ doc.classList.add("locked"); ctrl.remove();
    zones.forEach(z=>{ z.classList.remove("sel"); if(z.dataset.z===k.ans) z.classList.add("right"); }); };

  if(S.sel===k.ans){
    (S.wins=S.wins||[]).push(k.win); lock(); slot.innerHTML="";
    slot.appendChild(el(`<div class="verdict ok">
        <div class="v-head">◆ 情報確認</div>
        <p class="v-body">${k.payoff}</p></div>`));
    voiceGate(t,k,slot);
  } else if(S.tries===1){
    const z=doc.querySelector(".z.sel"); if(z){ z.classList.remove("sel"); z.classList.add("wrong"); }
    S.sel=null;
    const bs=document.getElementById("btnSend"); bs.disabled=true; bs.textContent="再點一行看看";
    slot.innerHTML="";
    slot.appendChild(el(`<div class="verdict no">
        <div class="v-head">◆ 需要複查</div>
        <p class="v-body">不是這一行。${k.hint}</p></div>`));
  } else {
    lock(); slot.innerHTML="";
    slot.appendChild(el(`<div class="verdict no">
        <div class="v-head">◆ 委託人回報</div>
        <p class="v-body">${k.miss}<br><br>那句話是綠色框起來那一行。下次先找它。</p></div>`));
    voiceGate(t,k,slot);
  }
  save();
}

function renderFinal(t){
  const wins=(S.wins||[]).filter(Boolean);
  S.done[t.id]=true; save();
  stage.appendChild(el(`<div class="final">
      <div class="tag">${t.name} 情報歸檔 ${bars(t.bars)}</div>
      <h2>${t.title}</h2>
      <div class="wins">${wins.length
        ? `<span class="tag">因為你看懂了，所以</span>`+wins.map(w=>`<div class="wrow">${w}</div>`).join("")
        : `<span class="tag">這一輪沒有情報送到委託人手上</span>`}</div>
      <div class="tally">口頭回報 ${S.spoken||0} 次</div>
      <div class="next"><span class="tag">解碼局備註</span>${t.close}</div>
      <div class="ctrl" style="margin-top:2px">
        <button class="ghost" id="again">重跑這個賽程</button>
        <button class="send" id="back">回賽程選單</button>
      </div>
    </div>`));
  document.getElementById("again").addEventListener("click",()=>startTier(t.id));
  document.getElementById("back").addEventListener("click",()=>{ renderMenu(); window.scrollTo(0,0); });
}

document.getElementById("home").addEventListener("click",()=>{ renderMenu(); window.scrollTo(0,0); });

function start(seed){
  try{
    if(seed && seed.done) S=Object.assign(S,seed); else load();
    if(S.tier && tier()) render(); else renderMenu();
  }catch(e){
    // 存檔壞了或某一關資料有問題，也要能回到選單，不能留一片空白
    if(window.__diag) window.__diag("啟動失敗，已重設進度", String(e&&(e.stack||e.message)||e).slice(0,400));
    try{ localStorage.removeItem(KEY); }catch(_){}
    S={tier:null,i:0,decoders:0,wins:[],tries:0,revealed:false,sel:null,spoken:0,micMode:false,done:{}};
    try{ renderMenu(); }catch(_){}
  }
}
window.claude?.hot?.snapshot?.(()=>S);
if(window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data);
</script>
